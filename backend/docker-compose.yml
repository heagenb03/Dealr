version: '3.8'

services:
  cashcage-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashcage-settlement-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
