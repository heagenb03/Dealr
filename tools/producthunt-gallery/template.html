<meta charset="utf-8">
<style>
  /* Fonts resolve through the node_modules JUNCTION to ../appstore-screenshots.
     Same family and weights as the App Store deck so the two sets look related. */
  @font-face { font-family: Inter; font-weight: 500; src: url('node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: Inter; font-weight: 700; src: url('node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: Inter; font-weight: 800; src: url('node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1270px; height: 760px; overflow: hidden;
    background: var(--canvas);
    font-family: Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Card-suit watermark, same construction as the App Store deck so the two sets read
     as one family. Opacity is DELIBERATELY lower than the deck's 0.04: the tile is a
     fixed 560px, so on this 1270x760 canvas roughly four tiles are visible instead of
     the deck's sparse scatter across 1290x2796, and at 0.04 the suits sit directly
     behind the headline and fight it. Do not "restore" this to 0.04 for consistency. */
  .suits {
    position: absolute; inset: 0; opacity: 0.022; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='560' height='560'><text x='40' y='120' font-size='120' fill='white'>♠</text><text x='320' y='260' font-size='150' fill='white'>♥</text><text x='90' y='430' font-size='135' fill='white'>♦</text><text x='360' y='520' font-size='120' fill='white'>♣</text></svg>");
    background-size: 560px 560px;
  }

  /* Two columns. `row-reverse` puts the art on the right without duplicating any
     rules, so the alternating set is one flag rather than two layouts. */
  .frame {
    position: relative; z-index: 2;
    display: flex; align-items: center;
    width: 100%; height: 100%;
    padding: 0 76px; gap: 80px;
  }
  body.side-right .frame { flex-direction: row-reverse; }

  /* Fixed-width art column so the copy column's wrap point cannot drift between
     images. Both art modes are centered inside it. */
  .art { flex: 0 0 300px; display: flex; justify-content: center; }

  /* ---- Phone frame -------------------------------------------------------
     Graphite rail, ported from the App Store deck's base.css at 0.3x scale
     (its 11px border / 74px radius sit on a ~980px-wide phone; ours is ~296px).

     A solid border takes exactly one colour and border-image does not follow
     border-radius, so this is a TRANSPARENT border with two stacked background
     layers clipped to different boxes: flat black screen to padding-box, the
     gradient rail to border-box. BOTH layers must originate at border-box or the
     rail is offset by the border width. Do not "simplify" this to a solid border. */
  .phone {
    width: 296px; aspect-ratio: 1179 / 2556;
    border: 3.5px solid transparent; border-radius: 24px;
    background-image:
      linear-gradient(#000, #000),
      linear-gradient(138deg,
        var(--rail-hi) 0%, #26262b 22%, var(--rail-lo) 50%, #2c2c32 74%, #85858f 100%);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.10),
      0 30px 60px rgba(0,0,0,.62),
      0 4px 14px rgba(0,0,0,.5);
    overflow: hidden;
  }
  .phone img { width: 100%; display: block; }

  /* ---- Chat panel (image 3) ----------------------------------------------
     Frameless by design: the deck's slide 3 is a group chat that has already left
     the app, so wrapping it in a phone would misrepresent it.

     The crop is applied here rather than by pre-cutting a PNG on disk, so the only
     stored copy of the chat scene stays the deck's own render and the crop box
     remains a readable number in gallery.config.mjs. */
  .panel {
    width: 300px; border-radius: 20px; overflow: hidden; position: relative;
    box-shadow: 0 30px 60px rgba(0,0,0,.62), 0 4px 14px rgba(0,0,0,.5);
  }
  .panel img { position: absolute; display: block; max-width: none; }

  .copy { flex: 1 1 auto; }

  /* The headline is designed as exactly TWO lines: a white line and an accent line.
     84px is the default and roughly the smallest size that still reads once the
     1270x760 PNG is downscaled to PH carousel width (~420px). A per-image
     `headlineSize` exists only for copy that genuinely cannot be shortened; prefer
     shortening. render.mjs asserts the two-line count either way, so a wrap to three
     lines fails the render rather than shipping quietly. */
  .headline {
    font-size: var(--headline-size, 84px); font-weight: 800;
    line-height: 1.05; letter-spacing: -0.025em;
    color: var(--headline);
  }
  .headline .accent { color: var(--accent); }

  .subhead {
    margin-top: 28px;
    font-size: 29px; font-weight: 500;
    line-height: 1.4; letter-spacing: -0.005em;
    color: var(--subhead);
    max-width: 15.5em;
  }
</style>

<div class="suits"></div>
<div class="frame">
  <div class="art"><div id="art"></div></div>
  <div class="copy">
    <div class="headline"><span id="hl"></span><br><span class="accent" id="hla"></span></div>
    <div class="subhead" id="sub"></div>
  </div>
</div>

<script>
  const IMAGE = /*__IMAGE_JSON__*/null;
  const THEME = /*__THEME_JSON__*/null;

  const root = document.documentElement.style;
  root.setProperty('--canvas', THEME.canvas);
  root.setProperty('--headline', THEME.headline);
  root.setProperty('--accent', THEME.accent);
  root.setProperty('--subhead', THEME.subhead);
  root.setProperty('--rail-hi', THEME.railHi);
  root.setProperty('--rail-lo', THEME.railLo);
  if (IMAGE.headlineSize) root.setProperty('--headline-size', IMAGE.headlineSize + 'px');

  document.body.classList.add('side-' + IMAGE.side);

  const art = document.getElementById('art');
  art.className = IMAGE.mode === 'panel' ? 'panel' : 'phone';
  const img = document.createElement('img');
  img.id = 'shot';
  img.alt = '';
  img.src = IMAGE.sourceDataUri;
  art.appendChild(img);

  // Panel mode crops a region out of the source by scaling the whole image to the
  // panel's width and sliding it under an overflow:hidden box. Runs on decode so
  // naturalWidth is real; render.mjs waits for the same load before screenshotting.
  if (IMAGE.mode === 'panel') {
    const { left, top, right, bottom } = IMAGE.crop;
    const done = () => {
      const scale = art.clientWidth / (right - left);
      art.style.height = ((bottom - top) * scale) + 'px';
      img.style.width = (img.naturalWidth * scale) + 'px';
      img.style.left = (-left * scale) + 'px';
      img.style.top = (-top * scale) + 'px';
      img.dataset.cropped = '1';
    };
    if (img.complete && img.naturalWidth) done();
    else img.addEventListener('load', done);
  }

  document.getElementById('hl').textContent = IMAGE.headline;
  document.getElementById('hla').textContent = IMAGE.headlineAccent;
  document.getElementById('sub').textContent = IMAGE.subhead;
</script>
