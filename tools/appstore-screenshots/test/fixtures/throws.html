<!doctype html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#1c0522">
<script>const SLIDE = /*__SLIDE_JSON__*/null;</script>
<h1 id="h"></h1>
<script>
  // Deliberately mirrors the original defect: a top-level throw during load
  // (e.g. reading a missing nested field, like SLIDE.reactions.emoji.join
  // did before the reactions.emoji key existed) that aborts the rest of the
  // script. Synchronous and unguarded, so it fires during page.goto's load
  // and is caught by renderSlide's pageerror listener before goto resolves.
  SLIDE.missing.boom;
  document.getElementById('h').textContent = SLIDE.headline;
</script>
</body></html>
