<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
</head>
<body>
<script>const SLIDE = /*__SLIDE_JSON__*/null;</script>
<div class="suits"></div>
<header class="caption">
  <p class="kicker"></p>
  <h1 class="headline"></h1>
</header>
<section class="surface">
  <div class="thread-head">
    <div class="avatars"></div>
    <div class="who"><span class="title"></span><span class="count"></span></div>
  </div>
  <div class="msgs"></div>
  <div class="compose">
    <div class="field">Message&hellip;</div>
    <div class="send">&#8593;</div>
  </div>
</section>
<script>
  document.body.classList.add(SLIDE.device);
  if (SLIDE.sentStyle) document.body.classList.add(`sent-${SLIDE.sentStyle}`);

  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

  document.querySelector('.kicker').textContent = SLIDE.kicker;
  document.querySelector('.headline').innerHTML = SLIDE.headline
    .map((line, i) => {
      const cls = i === SLIDE.headline.length - 1 ? ' class="grad"' : '';
      return `<span${cls}>${esc(line)}</span>`;
    })
    .join('<br>');

  // Chat header: overlapped initial avatars, group title, member count. The
  // avatar row is truncated (4 of 6) beside the full count, which is standard
  // chat-client behavior.
  // Colours are deliberately NOT Cash Cage purple. This chat is a third-party
  // messaging app, and a row of brand-purple circles was the loudest signal
  // that the panel was an in-app feature. These are the mixed colours a real
  // client auto-assigns per contact. Cyan is #64D2FF rather than an iOS blue
  // so the avatars stay distinct from the #0A84FF sent bubble (Task 2) --
  // true of the blue .msg.sent branch in base.css; the shipping sent bubble
  // (body.sent-accent) is grey, not blue, but the avatar colours are unchanged.
  const AV_COLORS = ['#FF9500', '#30D158', '#FF453A', '#64D2FF'];
  const avatars = document.querySelector('.avatars');
  SLIDE.chat.members.forEach((initial, i) => {
    const el = document.createElement('span');
    el.className = 'av';
    el.style.background = AV_COLORS[i % AV_COLORS.length];
    el.textContent = initial;
    avatars.appendChild(el);
  });
  document.querySelector('.title').textContent = SLIDE.chat.title;
  document.querySelector('.count').textContent = `${SLIDE.chat.count} people`;

  const msgs = document.querySelector('.msgs');

  // Oldest message first: .msgs is bottom-anchored inside a clipped panel, so
  // this is the element that gets cut off by the top edge when the thread
  // overflows. That clipping is the intended effect, not a defect.
  if (SLIDE.preface) {
    const el = document.createElement('div');
    el.className = 'msg recv older';
    el.innerHTML = `<span class="from">${esc(SLIDE.preface.from)}</span>${esc(SLIDE.preface.text)}`;
    msgs.appendChild(el);
  }

  if (SLIDE.timestamp) {
    const el = document.createElement('div');
    el.className = 'stamp';
    el.textContent = SLIDE.timestamp;
    msgs.appendChild(el);
  }

  // Anchor message: the app's real share output, verbatim. Payment annotations
  // in parens highlight purple; the inner alternation allows ONE level of nested
  // parens so "(Zelle (123)456-7890)" highlights whole, not split at "(123)".
  // The bubble, its reaction pill, and its receipt move as one unit. The group
  // sets no gap, so the pill's negative margin is an exact overlap instead of
  // fighting the 28px gap on .msgs.
  const group = document.createElement('div');
  group.className = 'sent-group';
  msgs.appendChild(group);

  const sent = document.createElement('div');
  sent.className = 'msg sent';
  sent.innerHTML = esc(SLIDE.shareText)
    .replace(/\(((?:[^()]|\([^()]*\))*)\)/g, '(<span class="handle">$1</span>)');
  group.appendChild(sent);

  if (SLIDE.reactions) {
    const el = document.createElement('div');
    el.className = 'reacts';
    el.innerHTML =
      `<span class="emo">${esc(SLIDE.reactions.emoji.join(''))}</span>` +
      `<span class="n">${SLIDE.reactions.count}</span>`;
    group.appendChild(el);
  }

  const receipt = document.createElement('div');
  receipt.className = 'receipt';
  receipt.textContent = 'Delivered';
  group.appendChild(receipt);

  // Replies: other players confirming payment. Copy is rail-agnostic by contract
  // (Wolfgang pays Maria by Venmo but Phil by Zelle) -- enforced by a test.
  for (const r of SLIDE.replies ?? []) {
    const el = document.createElement('div');
    // No `side` means received: the existing render.test.mjs fixture passes
    // replies without it and must keep its current left-aligned styling.
    el.className = r.side === 'sent' ? 'msg sent reply' : 'msg recv';
    el.innerHTML = `<span class="from">${esc(r.from)}</span>${esc(r.text)}`;
    msgs.appendChild(el);
  }
</script>
</body>
</html>
