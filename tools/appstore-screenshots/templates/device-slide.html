<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
</head>
<body>
<script>const SLIDE = /*__SLIDE_JSON__*/null;</script>
<div class="suits"></div>
<header class="caption">
  <p class="kicker"></p>
  <h1 class="headline"></h1>
</header>
<section class="stage">
  <div class="device">
    <div class="island"></div>
    <img class="capture" alt="">
  </div>
</section>
<script>
  document.body.classList.add(SLIDE.device);
  document.querySelector('.kicker').textContent = SLIDE.kicker;
  const h = document.querySelector('.headline');
  h.innerHTML = SLIDE.headline
    .map((line, i) => {
      const cls = i === SLIDE.headline.length - 1 ? ' class="grad"' : '';
      const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      return `<span${cls}>${esc}</span>`;
    })
    .join('<br>');

  const device = document.querySelector('.device');
  device.classList.add(SLIDE.device);
  if (SLIDE.layout) document.body.classList.add(`layout-${SLIDE.layout}`);
  if (SLIDE.deviceWidth) device.style.setProperty('--device-width', SLIDE.deviceWidth);
  if (SLIDE.deviceY) device.style.setProperty('--device-y', SLIDE.deviceY);
  // An explicit captureZoom of 1 is treated exactly like omitting it: both must
  // emit no transform, so both stay byte-identical to a pre-feature render.
  // Coerce before comparing: a string "1" from a config typo would otherwise
  // slip past a strict !== 1 check and apply an identity transform, which is
  // NOT a no-op (it promotes .capture to its own compositing layer).
  const zoom = Number(SLIDE.captureZoom);
  if (Number.isFinite(zoom) && zoom > 0 && zoom !== 1) {
    device.dataset.zoom = '';
    device.style.setProperty('--capture-zoom', zoom);
  }
  document.querySelector('.capture').src = SLIDE.capture;

  const stage = document.querySelector('.stage');
  for (const c of SLIDE.cards ?? []) {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.left = c.left + 'px';
    el.style.top = c.top + 'px';
    el.style.width = c.w * c.scale + 'px';
    el.style.height = c.h * c.scale + 'px';
    el.style.backgroundImage = `url("${SLIDE.capture}")`;
    el.style.backgroundPosition = `-${c.x * c.scale}px -${c.y * c.scale}px`;
    // background-size scales the WHOLE capture so the crop window lands right
    el.style.backgroundSize = `${1179 * c.scale}px auto`;
    if (c.captureWidth) el.style.backgroundSize = `${c.captureWidth * c.scale}px auto`;
    stage.appendChild(el);
  }
</script>
</body>
</html>
