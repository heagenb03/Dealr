<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>A Cash Cage game was shared with you</title>
  <meta name="robots" content="noindex" />
  <!-- The URL itself is the credential (~119 bits). Both iOS exits below are
       cross-origin (App Store, and the plain fallback <a>). Modern browsers
       already default to origin-only referrers, so this is not a live leak,
       but that default can't be relied on inside every chat-app WebView --
       suppress the referrer outright instead. Not needed for the App Store
       link to work. -->
  <meta name="referrer" content="no-referrer" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: #0A0A0A; color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .card { max-width: 380px; width: 100%; }
    /* The icon file's own corners sample #0A0A0A -- byte-identical to this
       page's background -- so the tile has no visible fill of its own and the
       1px hairline is what defines its shape. Do NOT "restore" a drop shadow
       here: black on #0A0A0A renders nothing. Flat is also what it is quoting,
       since iOS Home Screen icons carry no shadow.
       Served from /icon.png, which MUST stay absolute: firebase.json rewrites
       /g/** to /g/index.html, so a relative src resolves to /g/icon.png and
       comes back as this HTML document instead of a PNG. */
    .hero {
      display: block; width: 88px; height: 88px;
      margin: 0 auto 28px;
      border-radius: 22%;
      border: 1px solid #2A2A2A;
    }
    h1 { font-size: 24px; line-height: 1.25; margin: 0 0 12px; font-weight: 700; }
    p { font-size: 15px; line-height: 1.5; margin: 0 0 28px; color: #A0A0A0; }
    .cta {
      display: block; padding: 16px 24px; border-radius: 12px;
      background: #B072BB; color: #0A0A0A;
      font-size: 16px; font-weight: 700; text-decoration: none;
    }
    /* Not a button: nothing to tap, so it must not look tappable. */
    .cta--off {
      background: transparent; border: 1px solid #2A2A2A;
      /* #8A8A8A on #0A0A0A is 5.73:1 -- clears WCAG AA (4.5:1) for 16px text,
         and this badge is the one line that tells an Android recipient why
         nothing is happening. */
      color: #8A8A8A; font-weight: 600; cursor: default;
    }
    /* Tappable, unlike .cta--off: the App Store link still works on the
       expired branch. Demoted because the message is the point there, not the
       button. #B072BB on #0A0A0A measures 5.63:1 -- clears WCAG AA (4.5:1)
       for 16px text. */
    .cta--secondary {
      background: transparent; border: 1px solid #B072BB;
      color: #B072BB; font-weight: 600;
    }
    /* Same #8A8A8A as .cta--off above, same reason: the plain #6A6A6A this
       replaced was 3.66:1 on #0A0A0A, below the WCAG AA 4.5:1 floor for
       13px text -- and this line sits on the primary iOS path, seen by
       every recipient without the app installed. */
    .note { margin: 20px 0 0; font-size: 13px; color: #8A8A8A; }
  </style>
</head>
<body>
  <div class="card">
    <img class="hero" src="/icon.png" alt="Cash Cage" width="88" height="88" decoding="async" />
    <h1 id="headline">Someone shared a Cash Cage game with you</h1>
    <p id="lede">Get the app below to see who owes what and pay them in a tap.</p>
    <a class="cta" id="cta" href="https://apps.apple.com/app/id6759301097">Download on the App Store</a>
    <p class="note" id="note">Already have it? Tap or hold down the original link again.</p>
  </div>

  <script>
    // This page renders NO game data and performs NO Firestore read. Its only
    // job is the "app not installed" branch: iOS only loads this file when no
    // installed app claimed the URL.
    (function () {
      var APP_STORE = 'https://apps.apple.com/app/id6759301097';

      var isAndroid = /android/i.test(navigator.userAgent);
      var cta = document.getElementById('cta');

      // Android is a terminal state, not a store handoff. Cash Cage has no Play
      // listing -- play.google.com/store/apps/details?id=com.heagenb03.CashCage
      // returns 404 -- so a "Get the App" button there dead-ends on a generic
      // Google error page with no way back, and the "tap the link again" note
      // below it invites a loop for someone who cannot install the app. Say so
      // instead, and skip the clipboard write: a CC- token that can never be
      // redeemed is noise, and Android 12+ pops a visible paste toast for it.
      // When Android ships, this branch becomes the Play Store handoff.
      if (isAndroid) {
        document.getElementById('lede').textContent =
          'Cash Cage is on iPhone today — the Android app isn’t out yet.';
        var badge = document.createElement('div');
        badge.className = 'cta cta--off';
        badge.textContent = 'iOS only';
        cta.parentNode.replaceChild(badge, cta);
        // The note reads "Already have it? Tap or hold down the original link
        // again" -- a loop instruction for someone who cannot install the app
        // at all.
        document.getElementById('note').remove();
        return;
      }

      // The expiry rides in the URL (EXPIRY_PARAM in
      // frontend/utils/shareLink.ts) because this page cannot read the shared
      // document to find out: firestore.rules requires request.auth != null
      // for a get, and a visitor here is unauthenticated, so the read is
      // denied before expiresAt is ever evaluated -- expired, valid and
      // nonexistent all come back identical.
      //
      // ADVISORY ONLY. The rules still enforce the real expiry on every read,
      // and this value is stale after a re-share (publishSharedGame pushes
      // expiresAt out another 30 days while an older chat message still
      // carries the first value). parseInt(null) and parseInt('garbage') are
      // both NaN, and every comparison against NaN is false, so a missing or
      // tampered param falls through to the normal path below -- which is the
      // safe direction to be wrong in.
      var expiry = parseInt(new URLSearchParams(window.location.search).get('e'), 10);
      if (expiry > 0 && Date.now() > expiry * 1000) {
        document.getElementById('headline').textContent = 'This shared game link has expired';
        document.getElementById('lede').textContent =
          'Links last 30 days. Ask whoever sent it to share the game again.';
        // Kept, unlike the Android branch above: this destination is live and
        // installing is still the right next step. Demoted so it doesn't read
        // as "tap here to see the game", which it no longer does.
        cta.className = 'cta cta--secondary';
        // Returning here also skips the click handler below, so no CC- token
        // is written: a handoff token for a document the app will refuse is
        // noise, and Android 12+ pops a visible paste toast for it.
        //
        // The note reads "Already have it? Tap or hold down the original link
        // again" -- re-tapping an expired link changes nothing, and anyone who
        // does have the app never loads this page at all.
        document.getElementById('note').remove();
        return;
      }

      var storeUrl = APP_STORE;

      // Deferred deep link by clipboard handoff. The app reads this on first
      // launch after sign-in; see frontend/services/pendingShare.ts. A vendor
      // SDK would do this properly, but adds a third-party data-sharing
      // relationship to declare and a dependency that can itself sunset.
      var match = window.location.pathname.match(/^\/g\/([A-Za-z0-9]{20})\/?$/);
      var token = match ? 'CC-' + match[1] : null;

      cta.addEventListener('click', function (event) {
        if (!token || !navigator.clipboard) return;
        event.preventDefault();
        // Navigate whether or not the copy resolves — a failed copy must never
        // strand the user on this page. The documented recovery is to re-tap the
        // original link once the app is installed.
        navigator.clipboard.writeText(token)
          .catch(function () {})
          .then(function () { window.location.href = storeUrl; });
      });
    })();
  </script>
</body>
</html>
