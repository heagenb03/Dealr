<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>A Cash Cage game was shared with you</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: #0A0A0A; color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .card { max-width: 380px; width: 100%; }
    h1 { font-size: 24px; line-height: 1.25; margin: 0 0 12px; font-weight: 700; }
    p { font-size: 15px; line-height: 1.5; margin: 0 0 28px; color: #A0A0A0; }
    .cta {
      display: block; padding: 16px 24px; border-radius: 12px;
      background: #B072BB; color: #0A0A0A;
      font-size: 16px; font-weight: 700; text-decoration: none;
    }
    /* Not a button: nothing to tap, so it must not look tappable. */
    .cta--off {
      background: transparent; border: 1px solid #2A2A2A;
      color: #6A6A6A; font-weight: 600; cursor: default;
    }
    .note { margin: 20px 0 0; font-size: 13px; color: #6A6A6A; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Someone shared a Cash Cage game with you</h1>
    <p id="lede">Get the app to see who owes what &mdash; and pay them in a tap.</p>
    <a class="cta" id="cta" href="https://apps.apple.com/app/id6759301097">Get the App</a>
    <p class="note" id="note">Already have it? Tap the original link again.</p>
  </div>

  <script>
    // This page renders NO game data and performs NO Firestore read. Its only
    // job is the "app not installed" branch: iOS only loads this file when no
    // installed app claimed the URL.
    (function () {
      var APP_STORE = 'https://apps.apple.com/app/id6759301097';

      var isAndroid = /android/i.test(navigator.userAgent);
      var cta = document.getElementById('cta');

      // Android is a terminal state, not a store handoff. Cash Cage has no Play
      // listing -- play.google.com/store/apps/details?id=com.heagenb03.CashCage
      // returns 404 -- so a "Get the App" button there dead-ends on a generic
      // Google error page with no way back, and the "tap the link again" note
      // below it invites a loop for someone who cannot install the app. Say so
      // instead, and skip the clipboard write: a CC- token that can never be
      // redeemed is noise, and Android 12+ pops a visible paste toast for it.
      // When Android ships, this branch becomes the Play Store handoff.
      if (isAndroid) {
        document.getElementById('lede').textContent =
          'Cash Cage is on iPhone today — the Android app isn’t out yet.';
        var badge = document.createElement('div');
        badge.className = 'cta cta--off';
        badge.textContent = 'iOS only';
        cta.parentNode.replaceChild(badge, cta);
        // The note reads "Already have it? Tap the original link again" -- a
        // loop instruction for someone who cannot install the app at all.
        document.getElementById('note').remove();
        return;
      }

      var storeUrl = APP_STORE;

      // Deferred deep link by clipboard handoff. The app reads this on first
      // launch after sign-in; see frontend/services/pendingShare.ts. A vendor
      // SDK would do this properly, but adds a third-party data-sharing
      // relationship to declare and a dependency that can itself sunset.
      var match = window.location.pathname.match(/^\/g\/([A-Za-z0-9]{20})\/?$/);
      var token = match ? 'CC-' + match[1] : null;

      cta.addEventListener('click', function (event) {
        if (!token || !navigator.clipboard) return;
        event.preventDefault();
        // Navigate whether or not the copy resolves — a failed copy must never
        // strand the user on this page. The documented recovery is to re-tap the
        // original link once the app is installed.
        navigator.clipboard.writeText(token)
          .catch(function () {})
          .then(function () { window.location.href = storeUrl; });
      });
    })();
  </script>
</body>
</html>
